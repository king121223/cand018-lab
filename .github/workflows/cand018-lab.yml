name: cand018-lab
on: workflow_dispatch
jobs:
  lab:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set disposable admin password
        run: sudo dscl . -passwd /Users/runner 'LabPass123!'
      - name: Compile OD probe
        run: swiftc -O lab/od_probe.swift -o od_probe
      - name: Run OD probe (CAND-018 record-type experiment)
        env:
          LAB_USER: runner
          LAB_PASS: LabPass123!
        run: ./od_probe
      - name: Capture opendirectoryd logs (verbatim sqlite failures)
        run: |
          log show --last 15m --predicate 'process == "opendirectoryd"' --style compact > odlog.txt || true
          grep -nE "sqlite3_prepare|index|ACLcheck" odlog.txt | head -100 || true
      - name: Dump dslocal config/ACE records (ACL-default question)
        run: |
          sudo ls -la /var/db/dslocal/nodes/Default/ > dslocal_ls.txt || true
          sudo tar -cf dslocal_config.tar -C /var/db/dslocal/nodes/Default config 2>/dev/null || true
          mkdir -p dscfg && sudo cp -a /var/db/dslocal/nodes/Default/config/* dscfg/ 2>/dev/null || true
          for f in dscfg/*; do echo "== $f"; sudo plutil -p "$f" 2>/dev/null | head -60; done || true
      - name: Cross-check dyld cache policy strings on this build
        run: |
          sw_vers
          grep -c -a "alwaysAllowUnentitled" /System/Volumes/Preboot/Cryptexes/OS/System/Library/dyld/dyld_shared_cache_arm64e* 2>/dev/null | grep -v ":0" | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: cand018-lab-evidence
          path: |
            odlog.txt
            dslocal_ls.txt
            dscfg/
